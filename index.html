<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Google</title>
</head>
<body>
   <img src="google.png" alt="Google Logo">
   <div id="input-field">
        <img src="search_icon.png">
        <input type="text">
   </div>
   <div id="button-container">
        <button>Google Search</button>
        <button>I'm Feeling Lucky</button>
    </div>
   <p id="languages">Google offered in: <a href="https://vi.wikipedia.org/wiki/Ti%E1%BA%BFng_Vi%E1%BB%87t" target="_blank">Tiếng Việt</a> <a href="https://fr.wikipedia.org/wiki/Fran%C3%A7ais">Français</a> <a href="https://en.wikipedia.org/wiki/Chinese_language">繁體中文</a></p>
   <footer>
    <div id="location">Vietnam</div>
    <div id="sub-footer">
        <ul id="about-footer">
            <li>About</li>
            <li>Advertising</li>
            <li>Business</li>
            <li>How Search Works</li>
        </ul>
        <ul id="terms-footer">
            <li>Privacy</li>
            <li>Terms</li>
            <li>Settings</li>
        </ul>
    </div>
   </footer>
</body>
</html>
